<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Left document -->
  <rect x="180" y="240" width="280" height="360" rx="16" fill="#ffffff" opacity="0.9"/>
  <!-- Lines on left doc -->
  <rect x="210" y="290" width="180" height="10" rx="5" fill="#94a3b8"/>
  <rect x="210" y="320" width="220" height="10" rx="5" fill="#94a3b8"/>
  <rect x="210" y="350" width="160" height="10" rx="5" fill="#94a3b8"/>
  <rect x="210" y="380" width="200" height="10" rx="5" fill="#e74c3c" opacity="0.7"/>
  <rect x="210" y="410" width="180" height="10" rx="5" fill="#94a3b8"/>
  <rect x="210" y="440" width="220" height="10" rx="5" fill="#e74c3c" opacity="0.7"/>
  <rect x="210" y="470" width="140" height="10" rx="5" fill="#94a3b8"/>
  <rect x="210" y="500" width="200" height="10" rx="5" fill="#94a3b8"/>
  <rect x="210" y="530" width="170" height="10" rx="5" fill="#94a3b8"/>

  <!-- Right document -->
  <rect x="564" y="240" width="280" height="360" rx="16" fill="#ffffff" opacity="0.9"/>
  <!-- Lines on right doc -->
  <rect x="594" y="290" width="180" height="10" rx="5" fill="#94a3b8"/>
  <rect x="594" y="320" width="220" height="10" rx="5" fill="#94a3b8"/>
  <rect x="594" y="350" width="160" height="10" rx="5" fill="#94a3b8"/>
  <rect x="594" y="380" width="200" height="10" rx="5" fill="#27ae60" opacity="0.7"/>
  <rect x="594" y="410" width="180" height="10" rx="5" fill="#94a3b8"/>
  <rect x="594" y="440" width="220" height="10" rx="5" fill="#27ae60" opacity="0.7"/>
  <rect x="594" y="470" width="140" height="10" rx="5" fill="#94a3b8"/>
  <rect x="594" y="500" width="200" height="10" rx="5" fill="#94a3b8"/>
  <rect x="594" y="530" width="170" height="10" rx="5" fill="#94a3b8"/>

  <!-- Comparison arrows in center -->
  <path d="M485 390 L540 390" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M530 380 L545 390 L530 400" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M540 430 L485 430" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M495 420 L480 430 L495 440" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- MC text at bottom -->
  <text x="512" y="720" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="80" font-weight="700" fill="url(#accent)">MyCompare</text>

  <!-- Subtle tagline -->
  <text x="512" y="770" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="400" fill="#64748b">Dokumentenvergleich</text>
</svg>
